var K='lr100',S,tab='today',conf='',VIEW=null;
function iso(d){return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

if(!S||!S.start)S={start:iso(new Date()),days:{},inc:[],wt:[],rs:{}};
S.days=S.days||{};S.inc=S.inc||[];S.wt=S.wt||[];S.rs=S.rs||{};S.sk=S.sk||[];S.qt=S.qt||4;S.pt=S.pt||['','','','',''];S.rv=S.rv||{};S.fd=S.fd||{};S.cp=S.cp||{};S.gl=S.gl||{};if(!S.born)S.born=iso(new Date());S.bw=S.bw||{};S.pen=S.pen||{};if(!S.lvMax)S.lvMax=lvl().l}

function W(dt){if(!S.days[dt])S.days[dt]={p:[0,0,0,0,0],q:0,h:[0,0,0],f:0,c:0};return S.days[dt]}

function xp(d){var x=d.f*10+d.c*10+(d.h[0]&&d.h[1]?10:0)+(d.h[2]?5:0);return x+(gate(d)&&!d.sh?20:0)}

function lvAt(x){var l=1;while(l<100&&x>=cost(l)){x-=cost(l);l++}return l}

function rk(l){return l<10?'E':l<25?'D':l<45?'C':l<65?'B':l<85?'A':l<100?'S':'SS'}
function streak(){var n=dayNum(today()),s=0,i=n;if(!gate(D(dayDate(i))))i--;
for(;i>=1;i--){if(gate(D(dayDate(i))))s++;else break}return s}
function ml(){var m=today().slice(0,7);return S.inc.filter(function(e){return e.d.slice(0,7)==m})}
function sum(a){return a.reduce(function(s,e){return s+e.a},0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function seg(k,v,labels){return '<div class="seg">'+labels.map(function(t,i){return '<button class="'+(v==i&&i>0?'on':v==i?'idle':'')+'" onclick="SET(\''+k+'\','+i+')">'+t+'</button>'}).join('')+'</div>'}

function TP(i){var d=W(today());d.p[i]=d.p[i]?0:1;save();render()}
function SH(){var d=W(today());d.sh=d.sh?0:1;save();render()}
function PT(i,v){S.pt[i]=v;save()}
function QP(n){var d=W(today());d.qn=Math.max(0,(d.qn||0)+n);d.q=d.qn>=S.qt?1:0;save();render()}
function QT(n){S.qt=Math.max(1,Math.min(60,S.qt+n));var d=W(today());d.q=(d.qn||0)>=S.qt?1:0;save();render()}

function TR(i){S.rs[i]=S.rs[i]?0:1;save();render()}
